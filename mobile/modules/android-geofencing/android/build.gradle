apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "expo.modules.androidgeofencing"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
        targetSdk safeExtGet("targetSdkVersion", 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation project(':expo-modules-core')
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // Explicit declaration so suspendCancellableCoroutine is on the compile classpath
    // regardless of whether expo-modules-core exposes it as 'api' or 'implementation'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
