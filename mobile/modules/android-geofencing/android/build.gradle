apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Mirrors the helper defined in the root build.gradle so we don't need expo-module plugin
def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "expo.modules.androidgeofencing"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
        targetSdk safeExtGet("targetSdkVersion", 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

dependencies {
    // expo-modules-core is always a sub-project in Expo's Android build
    implementation project(':expo-modules-core')
    implementation "com.google.android.gms:play-services-location:21.3.0"
}
